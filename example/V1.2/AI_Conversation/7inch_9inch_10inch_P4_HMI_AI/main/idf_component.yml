## IDF Component Manager Manifest File
dependencies:
  waveshare/esp_lcd_sh8601: 1.0.2
  espressif/esp_lcd_ili9341: ==1.2.0
  espressif/esp_lcd_gc9a01: ==2.0.1
  espressif/esp_lcd_st77916: ^1.0.1
  espressif/esp_lcd_axs15231b: ^1.0.0
  espressif/esp_lcd_st7796:
    version: 1.3.4
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_spd2010: ==1.0.2
  espressif/esp_io_expander_tca9554: ==2.0.0
  espressif/esp_lcd_panel_io_additions: ^1.0.1
  78/esp_lcd_nv3023: ~1.0.0
  # Wi-Fi connection helper library, currently not directly used in P4 target in this project.
  # To avoid build failures when esp32p4 target cannot access component registry, only enable on common Wi-Fi boards (S3/C3).
  78/esp-wifi-connect:
    version: ~2.5.2
    rules:
    - if: target in [esp32s3, esp32c3, esp32p4]
  # Opus encoding library, mainly used for some voice upload/cellular module solutions.
  # When esp32p4 target cannot access component registry, to avoid build interruption due to download failures,
  # only enable on typical voice boards like S3/C3 here, whether to use is determined by each board's own sdkconfig.
  78/esp-opus-encoder:
    version: ~2.4.1
    rules:
    - if: target in [esp32s3, esp32c3, esp32p4]
  # ML307 cellular module, only used on some boards.
  # To avoid build failures in esp32p4 target with restricted network environment, only enable under specific targets here.
  78/esp-ml307:
    version: ~3.3.2
    rules:
    - if: target in [esp32s3, esp32c3, esp32p4]
  78/xiaozhi-fonts: ~1.5.2
  espressif/led_strip: ~3.0.1
  espressif/esp_codec_dev: ~1.4.0
  espressif/esp-sr: ~2.1.5
  espressif/button: ~4.1.3
  espressif/knob: ^1.0.0
  espressif/esp32-camera: ~2.1.2
  espressif/esp_lcd_touch_ft5x06: ~1.0.7
  espressif/esp_lcd_touch_gt911: ^1
  espressif/esp_lcd_touch_gt1151: ^1
  waveshare/esp_lcd_touch_cst9217: ^1.0.3
  espressif/esp_lcd_touch_cst816s: ^1.0.6
  lvgl/lvgl: ~9.3.0
  esp_lvgl_port: ~2.6.0
  espressif/esp_io_expander_tca95xx_16bit: ^2.0.0
  # The following two components are only used on specific boards like ESP-HI and are not used in the current project.
  # To avoid build failures due to inability to download from component registry in domestic environments, commented out here.
  # If you need to use emoji animations on ESP-HI and other boards later, please install manually according to official documentation:
  #   idf.py add-dependency \"espressif2022/image_player^1.1.0\"
  #   idf.py add-dependency \"espressif2022/esp_emote_gfx^1.0.0\"
  #espressif2022/image_player: ==1.1.0~1
  #espressif2022/esp_emote_gfx: ==1.0.0~2
  espressif/adc_mic: ^0.2.1
  espressif/esp_mmap_assets: '>=1.2'
  txp666/otto-emoji-gif-component: ~1.0.2
  espressif/adc_battery_estimation: ^0.2.0

  # SenseCAP Watcher Board
  wvirgil123/sscma_client:
    version: 1.0.2
    rules:
    - if: target in [esp32s3]

  tny-robotics/sh1106-esp-idf:
    version: ^1.0.0
    rules:
    - if: idf_version >= "5.4.0"

  waveshare/esp_lcd_jd9365_10_1:
    version: '*'
    rules:
    - if: target in [esp32p4]
  waveshare/esp_lcd_st7703:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ili9881c:
    version: ^1.0.1
    rules:
    - if: target in [esp32p4]
    
  espressif/esp_hosted:
    version: ^2.3.0

  espressif/esp_wifi_remote:
    version: ^0.16.1


  espfriends/servo_dog_ctrl:
    version: ^0.1.8
    rules:
    - if: target in [esp32c3]

  ## Required IDF version
  idf:
    version: '>=5.4.0'
  espressif/esp_lcd_ek79007: ^1.0.2
  espressif/esp_sccb_intf: ^0.0.5
  espressif/esp_cam_sensor: ^1.2.0