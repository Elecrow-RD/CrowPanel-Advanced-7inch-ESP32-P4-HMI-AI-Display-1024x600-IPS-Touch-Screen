dependencies:
  idf: ">=5.5"
  espressif/esp_lcd_ek79007: ^1.0.2
  # NOTE: keep esp_lvgl_port < 2.9.0. Version 2.9.0 renames the MIPI-DSI panel
  # callback to `on_frame_buf_complete` behind `#if ESP_IDF_VERSION >= 5.5.0`,
  # but IDF 5.5.4 still only provides `on_refresh_done`, so 2.9.0 fails to build.
  espressif/esp_lvgl_port: ">=2.8.0,<2.9.0"
  espressif/esp_lcd_touch_gt911: ^1.1.3
  lvgl/lvgl: "9.3.0"
